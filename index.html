<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RASYA - Top Up</title>
    
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>

        :root {
            --bg-main: #0d0612;
            --bg-card: rgba(22, 10, 30, 0.85);
            --bg-hover: rgba(38, 16, 52, 0.9);
            --accent-pink: #ff2a85;
            --accent-sakura: #ffb6c1;
            --accent-purple: #c77dff;
            --accent-yellow: #ffd166;
            --text-main: #fff0f5;
            --text-muted: #b89db0;
            --border-color: rgba(255, 42, 133, 0.25);
            --glow-pink: 0 0 20px rgba(255, 42, 133, 0.45);
            --glow-sakura: 0 0 15px rgba(255, 182, 193, 0.4);
            --radius: 14px;
            --ease-gpu: cubic-bezier(0.16, 1, 0.3, 1);
            --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-main);
        }

        body {
            background-image: 
                radial-gradient(circle at 10% 15%, rgba(255, 42, 133, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 85%, rgba(199, 125, 255, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        
        @keyframes fadeInGPU {
            from {
                opacity: 0;
                transform: translate3d(0, 16px, 0);
            }
            to {
                opacity: 1;
                transform: translate3d(0, 0, 0);
            }
        }

        @keyframes pinkGlow {
            0%, 100% {
                box-shadow: 0 0 12px rgba(255, 42, 133, 0.35), inset 0 0 6px rgba(255, 42, 133, 0.15);
            }
            50% {
                box-shadow: 0 0 24px rgba(255, 42, 133, 0.7), inset 0 0 12px rgba(255, 42, 133, 0.3);
            }
        }

        @keyframes floatTitle {
            0%, 100% { transform: translate3d(0, 0, 0); }
            50% { transform: translate3d(0, -5px, 0); }
        }

        /* ===== NAVBAR ===== */
        .navbar {
            background: rgba(13, 6, 18, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 14px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Rajdhani', sans-serif;
            font-size: clamp(20px, 4vw, 26px);
            font-weight: 800;
            color: #fff;
            text-decoration: none;
            letter-spacing: 0.5px;
        }

        .logo span.pink-highlight {
            color: var(--accent-pink);
            text-shadow: var(--glow-pink);
        }

        /* Language Switcher */
        .lang-switch {
            background: var(--bg-hover);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px;
            display: flex;
            gap: 4px;
        }

        .lang-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s var(--ease-gpu);
        }

        .lang-btn.active {
            background: var(--accent-pink);
            color: #fff;
            box-shadow: var(--glow-pink);
        }

        
        .hero {
            max-width: 1200px;
            margin: 15px auto;
            padding: 0 15px;
            animation: fadeInGPU 0.5s var(--ease-gpu);
        }

        .banner-card {
            position: relative;
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: var(--glow-pink);
            min-height: 150px;
            background: linear-gradient(135deg, #220b2a 0%, #0d0612 100%);
            display: flex;
            align-items: center;
            padding: 25px clamp(20px, 5vw, 40px);
        }

        .banner-text h2 {
            font-size: clamp(20px, 5vw, 28px);
            font-weight: 800;
            color: var(--accent-sakura);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            animation: floatTitle 4s ease-in-out infinite;
        }

        .banner-text p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: clamp(12px, 3vw, 15px);
        }

        
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 15px;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 992px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        
        .step-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: clamp(16px, 4vw, 24px);
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            animation: fadeInGPU 0.5s var(--ease-gpu) both;
        }

        .step-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            border-bottom: 1px dashed rgba(255, 42, 133, 0.2);
            padding-bottom: 10px;
        }

        .step-number {
            background: var(--accent-pink);
            color: #fff;
            font-weight: 800;
            min-width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            box-shadow: var(--glow-pink);
        }

        .step-title {
            font-size: clamp(15px, 3.5vw, 18px);
            font-weight: 700;
            color: var(--text-main);
        }

        /* ===== STEP 1: GAME GRID ===== */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(105px, 1fr));
            gap: 12px;
        }

        @media (min-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 15px;
            }
        }

        .game-card {
            background: var(--bg-hover);
            border: 1px solid rgba(255, 42, 133, 0.12);
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s var(--ease-bounce), border-color 0.3s;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translate3d(0, -4px, 0);
            border-color: var(--accent-pink);
        }

        .game-card img {
            width: 100%;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .game-card h4 {
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .game-card.active {
            border-color: var(--accent-pink);
            animation: pinkGlow 2.5s infinite;
            background: rgba(255, 42, 133, 0.12);
            transform: translate3d(0, -3px, 0);
        }

        .badge-hot {
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--accent-pink);
            color: #fff;
            font-size: 9px;
            font-weight: 800;
            padding: 2px 5px;
            border-radius: 4px;
            z-index: 2;
            box-shadow: var(--glow-pink);
        }

        /* ===== STEP 2: USER INPUT ===== */
        .input-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .input-field {
            flex: 1;
            min-width: 140px;
            background: #09030c;
            border: 1px solid rgba(255, 42, 133, 0.2);
            border-radius: 10px;
            padding: 12px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s var(--ease-gpu);
        }

        .input-field:focus {
            border-color: var(--accent-pink);
            box-shadow: var(--glow-pink);
            transform: translate3d(0, -2px, 0);
        }

        /* ===== STEP 3: NOMINAL GRID ===== */
        .nominal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }

        .nominal-card {
            background: var(--bg-hover);
            border: 1px solid rgba(255, 42, 133, 0.15);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.25s var(--ease-bounce), border-color 0.25s, background 0.25s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 1; /* Diubah agar tidak hilang saat di-render ulang */
        }

        .nominal-card:hover {
            transform: translate3d(0, -3px, 0);
            border-color: var(--accent-pink);
        }

        .nominal-card.active {
            border-color: var(--accent-pink);
            background: rgba(255, 42, 133, 0.18);
            box-shadow: var(--glow-pink);
            transform: translate3d(0, -2px, 0);
        }

        .nominal-card h5 { font-size: 13px; font-weight: 700; color: #fff; }
        .nominal-card p { font-size: 12px; color: var(--accent-sakura); font-weight: 700; margin-top: 3px; }

        
        .payment-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .payment-card {
            background: var(--bg-hover);
            border: 1px solid rgba(255, 42, 133, 0.15);
            border-radius: 10px;
            padding: 12px;
            cursor: pointer;
            transition: transform 0.25s var(--ease-bounce), border-color 0.25s;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .payment-card:hover { transform: translate3d(0, -3px, 0); border-color: var(--accent-pink); }

        .payment-card.active {
            border-color: var(--accent-pink);
            background: rgba(255, 42, 133, 0.18);
            box-shadow: var(--glow-pink);
        }

        .payment-card span { font-size: 13px; font-weight: 700; }

        /* ===== SIDEBAR ===== */
        .summary-card {
            position: sticky;
            top: 80px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .summary-row b { color: #fff; word-break: break-word; text-align: right; }

        .total-price {
            font-size: clamp(20px, 4vw, 24px);
            font-weight: 800;
            color: var(--accent-sakura);
            text-shadow: var(--glow-pink);
            transition: transform 0.2s var(--ease-bounce);
        }

        .btn-checkout {
            width: 100%;
            background: linear-gradient(45deg, #ff2a85, #ff758c);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.3s var(--ease-bounce), box-shadow 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 15px;
            box-shadow: var(--glow-pink);
        }

        .btn-checkout:hover {
            transform: translate3d(0, -3px, 0);
        }

        .btn-checkout:active {
            transform: translate3d(0, -1px, 0) scale(0.98);
        }

        
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translate3d(-50%, 100px, 0);
            background: #1c0a22;
            border: 1px solid var(--accent-pink);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: var(--glow-pink);
            transition: transform 0.4s var(--ease-bounce), opacity 0.4s;
            z-index: 9999;
            opacity: 0;
            font-size: 12px;
            font-weight: 600;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translate3d(-50%, 0, 0);
            opacity: 1;
        }

        .wa-float {
            position: fixed;
            bottom: 25px;
            right: 20px;
            background: #25d366;
            color: #fff;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 0 15px rgba(37, 211, 102, 0.5);
            text-decoration: none;
            z-index: 900;
            transition: transform 0.3s var(--ease-bounce);
        }

        .wa-float:hover { transform: scale(1.15) rotate(10deg); }

        .hidden { display: none !important; }
    </style>
</head>

            document.getElementById("lblTotal").innerText = t.lblTotal;
            document.getElementById("txtCheckoutBtn").innerText = t.checkoutBtn;

            document.querySelectorAll(".lang-btn").forEach(btn => {
                btn.classList.toggle("active", btn.getAttribute("data-lang") === lang);
            });
        }

        document.getElementById("langToggle").onclick = (e) => {
            const btn = e.target.closest(".lang-btn");
            if (btn) setLanguage(btn.getAttribute("data-lang"));
        };

        function renderGames() {
            const container = document.getElementById("gameGrid");
            container.innerHTML = database.games.map(g => `
                <div class="game-card ${g.id === currentGame.id ? 'active' : ''}" onclick="selectGame('${g.id}')">
                    ${g.hot ? '<span class="badge-hot">HOT</span>' : ''}
                    <img src="${g.img}" alt="${g.name}">
                    <h4>${g.name}</h4>
                </div>
            `).join('');
        }

       
        function renderItems() {
            const container = document.getElementById("nominalGrid");
            container.innerHTML = currentGame.items.map(item => `
                <div class="nominal-card ${item.id === currentItem.id ? 'active' : ''}" 
                     data-id="${item.id}"
                     onclick="selectItem('${item.id}')">
                    <div class="info">
                        <h5>${item.name}</h5>
                        <p>${formatRupiah(item.price)}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderPayments() {
            const container = document.getElementById("paymentGrid");
            container.innerHTML = database.payments.map(p => `
                <div class="payment-card ${p.id === currentPayment.id ? 'active' : ''}" onclick="selectPayment('${p.id}')">
                    <span>${p.name}</span>
                    <i class="fa-solid fa-chevron-right" style="font-size:10px; color:var(--text-muted);"></i>
                </div>
            `).join('');
        }

        function selectGame(gameId) {
            currentGame = database.games.find(g => g.id === gameId);
            currentItem = currentGame.items[0];
            
            const zoneInput = document.getElementById("zoneId");
            if (currentGame.needsZone) {
                zoneInput.classList.remove("hidden");
            } else {
                zoneInput.classList.add("hidden");
                zoneInput.value = "";
            }

            renderGames();
            renderItems();
            updateSummary();
            showToast(i18n[currentLang].toastGame);
        }

        
        function selectItem(itemId) {
            currentItem = currentGame.items.find(i => i.id === itemId);
            
            document.querySelectorAll(".nominal-card").forEach(card => {
                card.classList.toggle("active", card.getAttribute("data-id") === itemId);
            });

            updateSummary();
            showToast(i18n[currentLang].toastItem);
        }

        function selectPayment(payId) {
            currentPayment = database.payments.find(p => p.id === payId);
            renderPayments();
            updateSummary();
            showToast(i18n[currentLang].toastPay);
        }

        function updateSummary() {
            const uId = document.getElementById("userId").value.trim();
            const zId = document.getElementById("zoneId").value.trim();

            document.getElementById("sumGame").innerText = currentGame.name;
            document.getElementById("sumItem").innerText = currentItem ? currentItem.name : "-";
            
            const priceEl = document.getElementById("sumPrice");
            priceEl.style.transform = "scale(1.1)";
            priceEl.innerText = currentItem ? formatRupiah(currentItem.price) : "Rp0";
            setTimeout(() => priceEl.style.transform = "scale(1)", 150);

            document.getElementById("sumPay").innerText = currentPayment.name;

            if (!uId) {
                document.getElementById("sumUser").innerText = "-";
            } else {
                document.getElementById("sumUser").innerText = currentGame.needsZone && zId ? `${uId} (${zId})` : uId;
            }
        }

        document.getElementById("userId").addEventListener("input", updateSummary);
        document.getElementById("zoneId").addEventListener("input", updateSummary);

      
        document.getElementById("btnCheckout").onclick = () => {
            const uId = document.getElementById("userId").value.trim();
            const zId = document.getElementById("zoneId").value.trim();
            const t = i18n[currentLang];

            if (!uId) {
                alert(t.alertUser);
                document.getElementById("userId").focus();
                return;
            }

            if (currentGame.needsZone && !zId) {
                alert(t.alertZone);
                document.getElementById("zoneId").focus();
                return;
            }

            const accountId = currentGame.needsZone ? `${uId} (${zId})` : uId;
            const waNumber = "628814117571";

            const textInvoice = 
`*RASYA STORE ORDER* 
${t.waGreeting}
===============================
🎮 *Game:* ${currentGame.name}
🆔 *Account ID:* ${accountId}
💎 *Item:* ${currentItem.name}
💳 *Payment:* ${currentPayment.name}
💰 *Total:* ${formatRupiah(currentItem.price)}
===============================
Terima kasih! 🚀`;

            showToast("🚀 Redirecting to WhatsApp...");
            setTimeout(() => {
                window.open(`https://wa.me/${waNumber}?text=${encodeURIComponent(textInvoice)}`, "_blank");
            }, 600);
        };

        
        renderGames();
        renderItems();
        renderPayments();
        updateSummary();
    </script>
</body>
</html>
